<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FreshFind — Discover nearby farmers' markets, explore seasonal produce, check market schedules, and support local farmers in your community.">
  <meta name="keywords" content="farmers market, fresh produce, local food, seasonal vegetables, organic market, community market">
  <title>FreshFind — Discover Fresh Local Farmers' Markets</title>
  <meta name="theme-color" content="#faf7ef">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">



  <script>
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('freshfind_theme') === 'dark' ? 'dark' : 'light'; }
      catch (e) {   }
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#172D25' : '#faf7ef');
    })();
  </script>




  <style>
    :root { --accent: #355b43; --on-accent: #fff; }
    .skip-link {
      position: absolute; left: -9999px; top: 8px; z-index: 200;
      background: var(--accent); color: var(--on-accent); padding: 8px 16px;
      border-radius: 8px; text-decoration: none;
    }
    .skip-link:focus { left: 16px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
